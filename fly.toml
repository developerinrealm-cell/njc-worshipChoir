app = 'njc-worship-presenter'
primary_region = 'bom'

[build]
  [build.args]
    VITE_GOOGLE_CLIENT_ID = "656537064386-eilal5jl3b013fvpk755632fvg8n80mn.apps.googleusercontent.com"

[mounts]
  source = "worship_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024